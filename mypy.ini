# Static typing is enforced for scripts/orchestrator only.
#
# That package is where the algebraic types live, and its `match` statements
# rely on the checker for exhaustiveness: `assert_never` in the fallthrough arm
# is a type error unless every constructor is handled. Without a checker run
# those guards only fire at runtime, on the value that was already unhandled.
#
# The rest of the tree is untyped by history, not by intent. Widen the `files`
# list as modules gain annotations rather than lowering the bar here.
#
# Run from the repository root: `python3 -m mypy`

[mypy]
python_version = 3.12
files = scripts/orchestrator
ignore_missing_imports = True
disallow_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_redundant_casts = True
warn_return_any = True
warn_unused_ignores = True
