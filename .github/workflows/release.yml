name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install quality tools
        run: |
          python3 -m pip install --quiet -r requirements-dev.txt
          npm ci

      - name: Run quality gates
        run: python3 scripts/quality.py check

      - name: Build release archive
        run: |
          python3 scripts/release_packager.py --output-dir dist
          ls -la dist/

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ZIP="dist/codex-workflows-plugin-${VERSION}.zip"
          if [[ ! -f "$ZIP" ]]; then
            echo "Expected archive not found: $ZIP" >&2
            ls -la dist/
            exit 1
          fi
          gh release upload "$TAG" "$ZIP" install.sh --clobber
