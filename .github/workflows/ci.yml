name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Codex plugin
        run: python3 scripts/validate_plugin.py .

      - name: Install type checker
        run: python3 -m pip install --quiet mypy

      - name: Type-check the orchestrator
        run: python3 -m mypy

      - name: Run tests
        run: python3 -m unittest -v
